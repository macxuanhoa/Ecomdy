name: Validate repository
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: python -m unittest discover -s .harness/tests -p "test_*.py" -v
      - run: python .harness/scripts/validate.py
